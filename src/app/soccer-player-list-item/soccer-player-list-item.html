<div>

<h2>
  <a [routerLink]= "['/soccer-players', player().id]">
  {{player().name | titlecase }}

</a>
</h2>
  <p> Position: {{player().position | uppercase }}</p>

  <p> Player ID: {{ player().id | number:'1.0-0' }}</p>
@if (player().preferredFoot !== undefined){
  <p>Preferred Foot: {{ player().preferredFoot ? 'Yes' : 'No' }}</p>
} @else {
  <p>Preferred Foot: Not specified</p>
}
  <p>
    <a [routerLink]="['/soccer-players/edit', player().id]"
    (click)="$event.stopPropagation()">
      Edit Player
    </a>
    <button type="button" (click)="$event.stopPropagation();toggle()">
      Delete Player
    </button>
  </p>
</div>
