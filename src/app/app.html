@if (errorService.errorMessage()) {
  <div>
    <p>{{ errorService.errorMessage() }}</p>
    <button (click)="errorService.clearError()">Dismiss</button>
  </div>
}


<button (click)="editGuard.toggleGuard()">
  Edit Guard: {{ editGuard.guardEnabled() ? 'ON' : 'OFF' }}
</button>
@if (loadingService.isLoading()) {
  <span>Loading...</span>
}
<router-outlet/>
